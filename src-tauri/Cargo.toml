[package]
name = "musicx"
version = "0.1.0"
description = "musicx - the audio player (Hi-Fi local & network player)"
authors = ["musicx team"]
edition = "2021"

[lib]
name = "musicx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

# Hi-Fi Audio playback & decoding
symphonia = { version = "0.5", features = ["all"] }
cpal = "0.15"
rustfft = "6.2"

# Database & fast multithreaded scanning
rusqlite = { version = "0.32", features = ["bundled", "bundled-full"] }
jwalk = "0.8"

# Linux D-Bus MPRIS Media Controls

[target.'cfg(target_os = "linux")'.dependencies]
mpris-player = "0.6"
glib = "0.15"

# Fast Base64 encoding for embedded cover art
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
